<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Consulta de Temperatura</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="script.js"></script>
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="card shadow">
                <div class="card-body">
                    <h1 class="text-center mb-4">Consulta de Temperatura</h1>

                    <div class="mb-3">
                        <label for="cidade" class="form-label">Digite o nome da cidade:</label>
                        <input type="text" id="cidade" class="form-control" placeholder="Ex: Natal">
                    </div>

                    <button id="btnBuscar" class="btn btn-primary w-100">
                        Buscar temperatura
                    </button>

                    <div id="resultado" class="mt-4"></div>
                </div>
            </div>
        </div>
    </body>
</html>
