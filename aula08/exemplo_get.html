<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo requisição GET com jQuery e Ajax</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // Executa o script somente depois que todos os elementos da página estiverem disponíveis.
        $(document).ready(function() {
            // Associa ao botão o evento de clique que iniciará a busca dos dados.
            $("#btnBuscar").on("click", function() {
                $.ajax({
                    // Endereço do recurso que será consultado na API.
                    url: "https://jsonplaceholder.typicode.com/posts/101",
                    // Define que a comunicação com o servidor será feita pelo método GET.
                    type: "GET",
                    // Se a API responder com sucesso, mostra o título e o conteúdo recebidos.
                    success: function(response) {
                        console.log(response)
                        $("#resultado").html(
                            "<h3>" + response.title + "</h3>" +
                            "<p>" + response.body + "</p>"
                        );
                    },
                    // Se ocorrer algum problema na requisição, informa o erro ao usuário.
                    error: function() {
                        $("#resultado").html("Erro ao buscar dados.");
                    }
                });
            });
        });
    </script>
</head>
<body>
    <button id="btnBuscar">Buscar dados</button>
    <div id="resultado"></div>
</body>
</html>
