<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo requisição GET com jQuery e Ajax</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // Executa o script somente depois que todos os elementos da página estiverem disponíveis.
        $(document).ready(function() {
            // Dispara a requisição quando o botão for clicado.
            $("#btnBuscar").on("click", function() {
                // Faz uma requisição GET simplificada e entrega a resposta pronta no callback.
                $.get("https://jsonplaceholder.typicode.com/posts/8", function(data) {
                    // Converte o objeto retornado em texto para exibição direta na página.
                    $("#resultado").html(JSON.stringify(data));
                });
            });
        });
    </script>
</head>
<body>
    <button id="btnBuscar">Buscar dados</button>
    <div id="resultado"></div>
</body>
</html>
