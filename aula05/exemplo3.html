<html>
    <head>
        <meta charset="UTF-8">
        <script type="text/javascript">
            function clique() {
                let titulo = document.createElement("h1")
                // <h1></h1>
                titulo.innerHTML = "Programacao para Internet"
                // <h1>Programacao para Internet</h1>
                let div = document.querySelector("#div1")
                // <div id='div1'></div>
                div.appendChild(titulo)
                // <div id='div1'><h1>Programacao para Internet</h1></div>
            }
        </script>
    </head>
    <body>
        <div id="div1"></div>
        <button onclick="clique()">Ok</button>
    </body>
</html>
